
<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hệ thống Tiếp nhận và Quản lý hồ sơ - Chi nhánh Chơn Thành</title>
    <!-- ReactCrop CSS -->
    <link rel="stylesheet" href="https://unpkg.com/react-image-crop/dist/ReactCrop.css">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
      body {
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        background-color: #0f172a; /* MÀU TỐI ĐỂ KHỚP VỚI MÀN HÌNH LOGIN */
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }
      #root {
        height: 100%;
      }
      @media print {
        @page {
          margin: 10mm;
          size: auto;
        }
      }
      /* Loading Spinner ban đầu */
      #initial-loader {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0f172a; /* NỀN TỐI KHỚP DÀN LOGIN */
        z-index: 9999;
        transition: opacity 0.5s ease-out;
        gap: 16px;
      }
      .loader-logo-wrapper {
        position: relative;
        width: 88px;
        height: 88px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .loader-logo {
        width: 72px;
        height: 72px;
        object-fit: contain;
        animation: pulse-logo 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.4));
      }
      .spinner {
        position: absolute;
        inset: 0;
        width: 88px;
        height: 88px;
        border: 3px solid rgba(59, 130, 246, 0.15);
        border-top: 3px solid #3b82f6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        box-sizing: border-box;
      }
      @keyframes pulse-logo {
        0%, 100% { transform: scale(0.96); opacity: 0.9; }
        50% { transform: scale(1.04); opacity: 1; }
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
    <script>
      // --- POLYFILL CƠ BẢN CHO MÔI TRƯỜNG WEB ---
      if (typeof window.global === 'undefined') window.global = window;
      
      if (typeof window.process === 'undefined') {
        window.process = { 
          env: { 
            NODE_ENV: 'production',
            API_KEY: '' 
          },
          nextTick: function(fn) { setTimeout(fn, 0); },
          browser: true,
          version: '',
          versions: { node: '' }
        };
      }
    </script>
<script type="importmap">
{
  "imports": {

    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "vite": "https://esm.sh/vite@^7.3.0",
    "xlsx-js-style": "https://esm.sh/xlsx-js-style@^1.2.0",
    "buffer": "https://esm.sh/buffer@^6.0.3",
    "path": "https://esm.sh/path@^0.12.7",
    "file-saver": "https://esm.sh/file-saver@^2.0.5",

    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.89.0",
    "pizzip": "https://esm.sh/pizzip@^3.2.0",
    "docx-preview": "https://esm.sh/docx-preview@^0.3.7",
    "docxtemplater": "https://esm.sh/docxtemplater@^3.67.6"
  }
}
</script>
</head>
  <body>
    <div id="initial-loader">
      <div class="loader-logo-wrapper">
        <img src="./logo.png" alt="Logo Chi Nhánh Chơn Thành" class="loader-logo" />
        <div class="spinner"></div>
      </div>
      <div style="font-family: sans-serif; color: #94a3b8; font-weight: 600; font-size: 15px; letter-spacing: 0.5px; text-transform: uppercase;">Đang tải hệ thống...</div>
    </div>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
